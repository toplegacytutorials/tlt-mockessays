<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment | Top Legacy Tutorials</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-md">
        <div>
            <h1 id="header-title" class="font-bold text-lg text-white">Essay Exam</h1>
            <p class="text-xs text-slate-400">TOP LEGACY TUTORIALS</p>
        </div>
        <div class="flex items-center gap-4">
            <div class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl flex items-center gap-2">
                <span id="timer-display" class="font-mono font-bold text-rose-400">30:00</span>
            </div>
            <button onclick="confirmExit()" class="text-xs font-semibold text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg transition-colors">Exit</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-6 space-y-6 mt-4 flex-grow">
        
        <div id="question-paper" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl">
            <h2 id="question-text" class="text-xl md:text-2xl font-bold text-white mb-4 leading-relaxed"></h2>
            <p class="text-sm text-slate-400 mb-2"><strong>Instructions:</strong> Write clearly on paper, include a diagram if needed, take a clear photo, and upload below.</p>
        </div>

        <div id="submission-box" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl">
            <div id="upload-area" class="border-2 border-dashed border-slate-700 rounded-xl p-8 text-center hover:border-blue-500 transition-colors bg-slate-950/50 cursor-pointer relative">
                <input type="file" id="essay-image" accept="image/*" onchange="previewImage(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <p class="text-sm text-slate-300 font-medium">Tap to take a photo of your essay</p>
            </div>

            <div id="image-preview-container" class="hidden mt-4 relative rounded-xl overflow-hidden border border-slate-700">
                <img id="image-preview" class="w-full h-auto max-h-[400px] object-contain bg-black" />
                <button onclick="clearImage()" class="absolute top-2 right-2 bg-rose-600 hover:bg-rose-500 text-white p-2 rounded-lg text-xs font-bold shadow-lg">Remove</button>
            </div>

            <button id="submit-btn" onclick="submitEssay()" class="w-full mt-6 py-4 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Submit for AI Grading
            </button>
        </div>

        <div id="loading-state" class="hidden bg-slate-900 border border-blue-900/50 rounded-2xl p-8 text-center">
            <div class="animate-spin h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
            <h3 class="font-bold text-lg text-white mb-1">Grading & Emailing Result...</h3>
        </div>

        <div id="result-box" class="hidden bg-slate-900 border border-emerald-800/50 rounded-2xl overflow-hidden shadow-2xl">
            <div class="bg-emerald-900/20 px-6 py-4 border-b border-emerald-800/50">
                <h3 class="font-bold text-white text-lg">Official Result</h3>
            </div>
            <div id="ai-feedback-content" class="p-6 text-sm text-slate-300 whitespace-pre-line font-mono leading-relaxed bg-slate-950"></div>
            <div class="px-6 py-4 text-center">
                <button onclick="window.location.href='index.html'" class="px-6 py-2 bg-slate-800 text-white font-semibold rounded-lg">Return to Dashboard</button>
            </div>
        </div>
    </main>

    <script>
        // --- CONFIGURATION ---
        const urlParams = new URLSearchParams(window.location.search);
        const EXAM_ID = urlParams.get('exam') || 'carotid_triangle'; 
        const WEB3FORMS_ACCESS_KEY = "a9cd9997-29c3-486f-9667-bb01dfdb0375"; // Your key!
        
        // --- DATABASE OF QUESTIONS ---
        const questionsDb = {
            'carotid_triangle': {
                title: "Head & Neck Essay Exam",
                question: "Discuss the boundaries and contents of the Carotid Triangle.",
                time: 30
            },
            'neuro_corticospinal': {
                title: "Neuroanatomy Essay Exam",
                question: "Discuss the pathways of the corticospinal tract.",
                time: 45
            }
        };

        let timeRemaining = 0;
        let timerInterval;

        window.onload = () => {
            const examData = questionsDb[EXAM_ID] || questionsDb['carotid_triangle'];
            document.getElementById('header-title').innerText = examData.title;
            document.getElementById('question-text').innerText = examData.question;
            
            timeRemaining = examData.time * 60;
            startTimer();
        };

        function startTimer() {
            const display = document.getElementById('timer-display');
            display.innerText = formatTime(timeRemaining);
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                display.innerText = formatTime(timeRemaining);
                if (timeRemaining <= 0) { 
                    clearInterval(timerInterval); 
                    alert("Time is up! The assessment has been locked."); 
                    document.getElementById('submit-btn').disabled = true;
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('image-preview-container').classList.remove('hidden');
                document.getElementById('upload-area').classList.add('hidden');
                document.getElementById('submit-btn').disabled = false;
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            document.getElementById('essay-image').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('upload-area').classList.remove('hidden');
            document.getElementById('submit-btn').disabled = true;
        }

        function confirmExit() {
            if (confirm("Are you sure you want to exit?")) {
                window.location.href = 'index.html';
            }
        }

        async function submitEssay() {
            const file = document.getElementById('essay-image').files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            
            reader.onload = async () => {
                const base64String = reader.result.split(',')[1];
                const session = JSON.parse(localStorage.getItem('tlt_session'));
                const studentId = session ? session.id : "Unknown";
                
                document.getElementById('submission-box').classList.add('hidden');
                document.getElementById('question-paper').classList.add('hidden');
                document.getElementById('loading-state').classList.remove('hidden');

                try {
                    // 1. Send to Vercel for AI Grading
                    const response = await fetch('/api/grade-essay', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            examId: EXAM_ID,
                            image: base64String,
                            mimeType: file.type,
                            studentId: studentId
                        })
                    });

                    if (!response.ok) throw new Error("Server error");
                    const data = await response.json();
                    
                    // 2. Show Result on Screen
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('result-box').classList.remove('hidden');
                    document.getElementById('ai-feedback-content').innerText = data.feedback;

                    // 3. SEND EMAIL TO YOU VIA WEB3FORMS
                    await fetch("https://api.web3forms.com/submit", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Accept: "application/json"
                        },
                        body: JSON.stringify({
                            access_key: WEB3FORMS_ACCESS_KEY,
                            subject: `Essay Graded: ${studentId} - ${data.score}/${data.total}`,
                            Student_ID: studentId,
                            Exam: EXAM_ID,
                            Score: `${data.score}/${data.total}`,
                            Feedback: data.feedback
                        })
                    });

                } catch (error) {
                    console.error(error);
                    alert("Failed to grade essay. Please try again.");
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('submission-box').classList.remove('hidden');
                    document.getElementById('question-paper').classList.remove('hidden');
                }
            };
        }
    </script>
</body>
</html>
